name: Test readers
on: [push, pull_request]
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/sync-spec.py && python3 tests/make_fixtures.py && git diff --exit-code
      - run: PYTHONPATH=packages/python/src python3 -m unittest discover -s tests -p 'test_*.py'
      - run: deno test --allow-read packages/typescript/tests
      - run: npm install && npm run build
        working-directory: packages/typescript
      - run: cargo test --locked --manifest-path packages/rust/Cargo.toml
      - run: cargo build --locked --manifest-path packages/rust/Cargo.toml
      - run: python3 tests/conformance.py
